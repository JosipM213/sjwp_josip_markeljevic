<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forme</title>
  </head>
  <body>
    <h1>Forme u HTML</h1>
    <form action="#" method="get">
      <label for="ime">Unesi ime:</label>
      <input type="text" id="ime" placeholder="Unesi ime..." /><br /><br />
      <label for="prezime">Unesi prezime: </label>
      <input type="text" id="prezime" size="10" /><br /><br />
      <label for="pass">Unesi lozinku</label>
      <input type="password" required name="pass" id="pass" /><br /><br />
      <label for="mail">Unesi email</label>
      <input type="email" name="mail" id="mail" /><br /><br />
      <input type="submit" value="Pošalji" /><br></br>
      <label for="date">Unesi Datum</label>
      <input type="date" name="date" id="date"><br></br>
      <label for="boja">Izaberi boju</label>
      <input type="color" name="boja" id="boja"><br></br>
      <label for="dtt">Priloži datoteku</label>
      <input type="file" name="dtt" id="dtt"><br></br>
      <label for="tel">Unesi broj mobitela</label>
      <input type="tel" name="tel" id="tel"><br></br>
      <p>Odaberi najbolji klub:</p>
      <input type="radio" name="klub" id="Real" value="Real Madrid">
      <label for="Real">Real Madrid</label><br>
      <input type="radio" name="klub" id="barca">
      <label for="barca">Barcelona</label><br>
      <p>Odaberi najbolji klub:</p>
      <input type="checkbox" name="klub" id="Real" value="Real Madrid">
      <label for="Real">Real Madrid</label><br>
      <input type="checkbox" name="klub1" id="barca">
      <label for="barca">Barcelona</label><br>
      <input type="reset" value="obriši">
    </form>
  </body>
</html>
