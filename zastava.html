<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    html {
      background-color: black;
    }
    div {
      height: 600px;
      width: 1300px;
      border: solid white 5px;
      border-radius: 100px;
      margin: auto auto;
    }
    .p1 {
      background-color: black;
    }
    .p2 {
      background-color: red;
    }
    .p3 {
      background-color: yellow;
    }
    p {
      height: 200px;
      width: auto;
      margin: 0;
      border: 0;
      position: relative;
      z-index: -1;
    }
  </style>
  <body>
    <div>
      <p class="p1"></p>
      <p class="p2"></p>
      <p class="p3"></p>
    </div>
  </body>
</html>
